{{- $chartName := include "geoserver-api.name" . -}}
{{- $configmapName := include "configmap.fullname" . }}
{{- $server := .Values.server -}}
{{- $telemetry := .Values.telemetry -}}
{{- $tracingUrl := include "geoserver-api.tracingUrl" . -}}
{{- $opentelemetryLoggingUrl := include "geoserver-api.opentelemetryLoggingUrl" . -}}
{{- $serviceUrls := (include "common.serviceUrls.merged" .) | fromYaml }}
{{- $db := (include "common.db.merged" .) | fromYaml }}
{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $configmapName  }}
data:
  {{- with $server }}
  REQUEST_PAYLOAD_LIMIT: {{ .requestPayloadLimit | quote }}
  RESPONSE_COMPRESSION_ENABLED: {{ .responseCompressionEnabled | quote }}
  {{- end }}
  {{- with $telemetry }}
  LOG_LEVEL: {{ .logger.level | quote }}
  LOG_PRETTY_PRINT_ENABLED: {{ .logger.prettyPrint | quote }}
  {{- with .logger.opentelemetryOptions }}
  OPENTELEMETRY_LOGGING_ENABLED: {{ .enabled | quote }}
  {{- if .enabled }}
  OTLP_LOGGER_ENDPOINT_URL: {{ $opentelemetryLoggingUrl | quote }}
  {{- if .resourceAttributes }}
  OTEL_RESOURCE_ATTRIBUTES: {{ include "geoserver-api.otelResourceAttributes" .resourceAttributes | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  TELEMETRY_TRACING_ENABLED: {{ .tracing.enabled | quote }}
  {{- if .tracing.enabled }}
  TELEMETRY_TRACING_URL: {{ $tracingUrl | quote }}
  {{- end }}
  {{- end }}
  HTTP_RETRY_ATTEMPTS: {{ .Values.env.httpRetry.attempts | quote }}
  HTTP_RETRY_DELAY: {{ .Values.env.httpRetry.delay | quote }}
  HTTP_RETRY_RESET_TIMEOUT: {{ .Values.env.httpRetry.resetTimeout | quote }}
  DISABLE_HTTP_CLIENT_LOGS: {{ .Values.env.disableHttpClientLogs | quote }}
  GEOSERVER_URL: {{ $serviceUrls.geoserverUrl }}
  DATASTORE_HOST: {{ $db.host }}
  DATASTORE_PORT: {{ $db.port | quote }}
  DATASTORE_SCHEMA: {{ $db.schema }}
  DATASTORE_NAME: {{ $db.name }}
  DATASTORE_TYPE: {{ $db.dbType }}
  DATASTORE_SSL_MODE: {{ $db.sslEnabled | ternary "ALLOW" "DISABLE"}}
  GEOSERVER_SRS: {{ .Values.env.srs | quote }}
  GEOSERVER_NUM_OF_DECIMALS: {{ .Values.env.numOfDecimals | quote }}
  WFS_MAX_FEATURES: {{ .Values.env.wfsMaxFeatures | quote }}

  {{- with .Values.configManagement }}
  CONFIG_NAME: {{ .name | quote }}
  CONFIG_VERSION: {{ .version | quote }}
  CONFIG_OFFLINE_MODE: {{ .offlineMode | quote }}
  CONFIG_SERVER_URL: {{ .serverUrl | quote }}
  {{- end }}

  {{- end }}
