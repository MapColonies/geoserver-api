global:
  cloudProvider: {}
  telemetry:
    tracing: {}
    logger:
      opentelemetryOptions: {}
  environment: ''
  serviceUrls:
    geoserverUrl: ""
  geoserver:
    secrets:
      useExternal: false
      externalSecretName: ''
    auth:
      username: ""
      password: ""
  db:
    username: ""
    password: ""
    host: ""
    port: ""
    schema: ""
    name: ""
    dbType: ""
    sslMode: ""
    sslEnabled: false
    secrets:
      useExternal: false
      externalSecretName: ''
  ca:
    secretName: ''
    path: '/usr/local/share/ca-certificates'
    key: 'ca.crt'
  ingress:
    domain: 'apps.aroapp.io'

mclabels:
  #environment: development
  component: backend
  partOf: ingestion
  owner: raster
  gisDomain: raster
  prometheus:
    enabled: true
    port: 8080

enabled: true
environment: development
replicaCount: 1
revisionHistoryLimit: 5 # Amount of revisions we keep
initialDelaySeconds: 60
nodePort: 30030 #for minikube deployment only
resetOnConfigChange: true
imagePullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

livenessProbe:
  enabled: true
  initialDelaySeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  path: /liveness

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  path: /liveness

podAnnotations: {}

extraVolumes: []

extraVolumeMounts: []

extraEnvVars: []

command: []
args: []
# command: [ "/bin/sh", "-c", "--" ]
# args: [ "while true; do sleep infinity; done;" ]

sidecars: []

caSecretName: ''
caPath: '/usr/local/share/ca-certificates'
caKey: 'ca.crt'

image:
  repository: geoserver-api
  tag: 'latest'

cloudProvider:
  dockerRegistryUrl: my-registry-url.io
  imagePullSecretName: 'my-registry-secret'
  flavor: openshift

geoserver:  
  secrets:
      useExternal: true
      externalSecretName: ''
db: 
  host: ''
  port: ''
  schema: 'polygon_parts'
  name: ''
  dbType: 'postgis'
  sslEnabled: false
  secrets:
      useExternal: true
      externalSecretName: ''
serviceUrls:
  geoserverUrl: ''      

configManagement:
  offlineMode: true
  name: 'geoserver-api'
  version: 'latest'
  serverUrl: 'http://localhost:8080/api'

server:
  port: 80
  targetPort: 8080
  protocol: TCP
  responseCompressionEnabled: true
  requestPayloadLimit: 1mb

telemetry:
  logger:
    level: info
    prettyPrint: false
    opentelemetryOptions:
      enabled: true
      url: http://localhost:4317
      # Rendered as OTEL_RESOURCE_ATTRIBUTES in "key=value,key=value" format
      # resourceAttributes:
      #   service.namespace: namespace
      #   deployment.environment: dev
  tracing:
    enabled: true
    url: http://localhost:55681/v1/traces

env:
  disableHttpClientLogs: false
  httpRetry:
    attempts: 5
    delay: exponential
    resetTimeout: true
  srs: "EPSG:4326"
  numOfDecimals: 100
  wfsMaxFeatures: 1000

resources:
  enabled: false
  value:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

route:
  enabled: true
  path: /
  host: 
  timeout:
    enabled: false # defaults to 30s by openshift
    duration: 60s # supported units (us, ms, s, m, h, d)
  rewriteTarget: ''
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    useCerts: false
    certificate: ''
    key: ''
    caCertificate: ''

ingress:
  enabled: false
  type: 'nginx-org' # supported values: 'nginx-org' | 'nginx-kubernetes'
  path: /
  host: 'localhost'
  cors:
    enabled: true
    origin: '*'
